<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Éclat">
  <title>Éclat</title>

  <defs>
    <!-- Chaque panneau porte son propre dégradé : c'est ce qui donne
         l'impression d'une surface éclairée plutôt que peinte. -->
    <linearGradient id="haut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ad8ff"/>
      <stop offset="1" stop-color="#2f7be8"/>
    </linearGradient>
    <linearGradient id="gauche" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33e0b0"/>
      <stop offset="1" stop-color="#0f9f8a"/>
    </linearGradient>
    <linearGradient id="droite" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#e0347a"/>
    </linearGradient>
    <linearGradient id="centre" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Le halo diffus, comme celui que l'application rend en WebGL. -->
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <g transform="translate(28, 41)">
    <g filter="url(#halo)" opacity="0.75">
      <polygon points="100.00,5.77 55.00,83.72 145.00,83.72" fill="#2f7be8"/>
      <polygon points="50.00,92.38 5.00,170.32 95.00,170.32" fill="#0f9f8a"/>
      <polygon points="150.00,92.38 105.00,170.32 195.00,170.32" fill="#e0347a"/>
      <polygon points="55.00,89.49 145.00,89.49 100.00,167.43" fill="#ffffff"/>
    </g>

    <polygon points="100.00,5.77 55.00,83.72 145.00,83.72" fill="url(#haut)"/>
    <polygon points="50.00,92.38 5.00,170.32 95.00,170.32" fill="url(#gauche)"/>
    <polygon points="150.00,92.38 105.00,170.32 195.00,170.32" fill="url(#droite)"/>
    <polygon points="55.00,89.49 145.00,89.49 100.00,167.43" fill="url(#centre)"/>
  </g>
</svg>
