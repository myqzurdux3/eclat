name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tests touch no hardware, network, GPU or DOM: the device is
      # doubled end to end.
      - run: npm test

      - run: npm run typecheck

      - run: npm run build
